# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Evita avisos de funding/audit a bloquear CI (opcional)
  NPM_CONFIG_AUDIT = "false"

# SPA — React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# FFmpeg.wasm precisa de SharedArrayBuffer; só nestes assets (não em /*).
# COEP require-corp aqui não bloqueia vídeos R2 no resto da app.
[[headers]]
  for = "/ffmpeg/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cache-Control = "public, max-age=31536000, immutable"
